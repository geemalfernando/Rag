services:
  - type: web
    name: rag
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn rag.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEMINI_API_KEY
        sync: false # you paste this in the Render dashboard; it never goes in the repo
      - key: RAG_CHAT_MODEL
        value: gemini-flash-lite-latest
