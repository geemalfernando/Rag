[project]
name = "rag"
version = "0.1.0"
description = "A small RAG tool that keeps its index in sync as documents change, powered by Gemini."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0",
    "numpy>=1.26",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
]

[project.scripts]
rag = "rag.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gemini: hits the real Gemini API (needs GEMINI_API_KEY)"]
